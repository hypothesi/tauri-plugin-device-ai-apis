name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ref = await github.request("GET /repos/{owner}/{repo}/git/ref/{ref}", {
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            if (ref.data.object.type !== "tag") {
              core.setFailed(`Tag ${tag} must be an annotated signed tag (lightweight tags are not allowed).`);
              return;
            }

            const tagObject = await github.request("GET /repos/{owner}/{repo}/git/tags/{tag_sha}", {
              owner,
              repo,
              tag_sha: ref.data.object.sha,
            });

            const verification = tagObject.data.verification;
            if (!verification?.verified) {
              core.setFailed(`Tag ${tag} is not a verified signed tag. Reason: ${verification?.reason ?? "unknown"}`);
              return;
            }

            core.info(`Verified signed tag ${tag} by ${tagObject.data.tagger?.name ?? "unknown"}.`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run release:validate -- ${{ github.ref_name }}
      - run: npm run standards
      - run: cargo test --all-targets --all-features
      - run: npm run build
      - name: Build example app
        run: |
          cd examples/tauri-app
          npm ci
          npm run build
      - run: cargo package --locked -p device-ai
      - name: List plugin crate package contents
        run: cargo package --list -p tauri-plugin-device-ai-apis

  publish-release:
    needs: verify-release
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing exchanges the Actions OIDC token for a registry token, which npm
      # only knows how to do from 11.5.1 onward. Pin the npm release so the exchange does
      # not depend on whichever npm the runner's Node happens to bundle.
      - name: Install an npm release that supports Trusted Publishing
        run: npm install --global npm@12.0.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - run: npm ci
      - run: npm run release:validate -- ${{ github.ref_name }}
      - run: npm run build

      - name: Publish device-ai crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node ./scripts/publish-crate.mjs device-ai

      - name: Publish Tauri plugin crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node ./scripts/publish-crate.mjs tauri-plugin-device-ai-apis

      - name: Publish npm package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on the npm registry. Skipping publish."
            exit 0
          fi

          npm publish --provenance --access public

  create-github-release:
    needs: publish-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
